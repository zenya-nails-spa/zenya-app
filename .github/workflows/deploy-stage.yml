name: Deploy to Firebase Hosting on merge (STAGE)

on:
  push:
    branches:
      - stage

env:
  PROJECT_ID: zenya-nails-spa-stage
  REGION: us-central1
  SERVICE: zenya-app-stage
  IMAGE: us-central1-docker.pkg.dev/zenya-nails-spa-stage/zenya-router/zenya-app-stage

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build React App
        run: npm run build

      - name: 📁 Nest build under /admin
        run: |
          mkdir -p admin_build/admin
          mv build/* admin_build/admin/
          rm -rf build
          mv admin_build build

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run (Stage)
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --timeout 60s \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --port 8080 \
            --project $PROJECT_ID

      - name: 🔥 Deploy routing rules to Firebase Hosting (STAGE)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}
          channelId: live
          projectId: zenya-nails-spa-stage
