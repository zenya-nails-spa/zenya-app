# .github/workflows/prevent-non-stage-merges.yml
name: Prevent non-stage merges

on:
  pull_request:
    branches:
      - '**'

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if not from stage
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.base_ref }}" == "master" && "${{ github.head_ref }}" != "stage" ]]; then
            echo "ERROR: Only 'stage' can be merged into 'master'. Current source: ${{ github.head_ref }}"
            exit 1
          fi
          echo "Branch check passed."
